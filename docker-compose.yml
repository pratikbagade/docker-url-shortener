services:
  cache:
     image: redis:7-alpine
     command: ["redis-server", "--appendonly", "yes"]
     volumes:
      - redisdata:/data

     networks: 
       - backend
     healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  app:
    build: ./app
    image: visit-counter:v1
    env_file: .env
    networks:
      - frontend
      - backend
    depends_on:
      cache:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./nginx
    image: visit-counter-nginx:v1
    ports:
      - "8080:80"
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  redisdata:
